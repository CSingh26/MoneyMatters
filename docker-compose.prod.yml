services:
  auth-service:
    image: 526261729062.dkr.ecr.us-east-1.amazonaws.com/policylens/auth-service:latest
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env.auth
    networks:
      - policylens

  finance-service:
    image: 526261729062.dkr.ecr.us-east-1.amazonaws.com/policylens/finance-service:latest
    container_name: finance-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - .env.finance
    networks:
      - policylens

  policy-service:
    image: 526261729062.dkr.ecr.us-east-1.amazonaws.com/policylens/policy-service:latest
    container_name: policy-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    env_file:
      - .env.policy
    volumes:
      - policy-uploads:/app/policy-service/uploads
    networks:
      - policylens

  ai-service:
    image: 526261729062.dkr.ecr.us-east-1.amazonaws.com/policylens/ai-service:latest
    container_name: ai-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    env_file:
      - .env.ai
    networks:
      - policylens

  dashboard-service:
    image: 526261729062.dkr.ecr.us-east-1.amazonaws.com/policylens/dashboard-service:latest
    container_name: dashboard-service
    restart: unless-stopped
    ports:
      - "3005:3005"
    env_file:
      - .env.dashboard
    networks:
      - policylens

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - finance-service
      - policy-service
      - ai-service
      - dashboard-service
    networks:
      - policylens

volumes:
  policy-uploads:

networks:
  policylens:
    driver: bridge
